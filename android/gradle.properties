# AndroidX is required: every dependency this app uses (appcompat, webkit,
# material, biometric) is an AndroidX artifact. Without this flag the build
# fails at dependency resolution with a very long list of AndroidX modules.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Kotlin DSL used by Gradle 8.14 cannot parse the version string of the
# JDK 25 that ships as Android Studio's JBR ("IllegalArgumentException: 25.0.3"),
# which is why the build used to die before compiling a single line. Pinning
# the daemon to a JDK 17 makes the build work no matter which JDK is on PATH.
org.gradle.java.home=E:\\toolchain\\jdk\\jdk-17.0.20.1+1

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.compiler.execution.strategy=in-process
