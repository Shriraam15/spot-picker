<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover so the layout reaches under notches in the Android WebView;
         user-scalable=no keeps pinch-zoom from fighting the map gestures. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Spot Picker — drop a pin anywhere and use it as your device's mock location."
    />
    <title>Spot Picker — Mock Location Picker</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('spotpicker.theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode / storage disabled — fall back to the CSS default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
